<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>泡泡鱼图鉴 | 社区</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #c2e0f0 0%, #8ac4d8 100%);
            font-family: 'Segoe UI', sans-serif;
            padding: 1.5rem;
            min-height: 100vh;
            color: #02457a;
        }
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(3px);
            border-radius: 2.5rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.25);
            padding: 1.8rem 2rem 2rem;
        }
        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px dashed #7fc5df;
        }
        .logo h1 { 
            font-size: 1.8rem; 
            background: linear-gradient(135deg, #016b8c, #02a9c0); 
            background-clip: text; 
            -webkit-background-clip: text; 
            color: transparent; 
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .logo h1:hover { opacity: 0.8; }
        .nav-buttons { display: flex; gap: 1rem; }
        .nav-btn { 
            background: #2b9fc2; 
            border: none; 
            padding: 0.5rem 1.2rem; 
            border-radius: 2rem; 
            color: white; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .nav-btn:hover { background: #f59e0b; transform: translateY(-2px); }
        .nav-btn.active { background: #f59e0b; }
        .add-fish-btn { background: #2c6e3c; }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: space-between;
            margin-bottom: 1.8rem;
            background: #f4fbfecc;
            padding: 0.8rem 1.2rem;
            border-radius: 2rem;
        }
        .search-box input { padding: 0.5rem 1rem; border-radius: 2rem; border: 1px solid #cde5f0; width: 220px; }
        .sort-box { display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap; }
        .sort-btn { background: #e7f2f7; border: none; padding: 0.4rem 1rem; border-radius: 2rem; cursor: pointer; font-weight: 500; }
        .sort-btn.active { background: #f59e0b; color: white; }
        .fish-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.8rem;
            margin-top: 1rem;
        }
        .fish-card {
            background: white;
            border-radius: 1.8rem;
            overflow: hidden;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
            cursor: pointer;
            position: relative;
        }
        .fish-card:hover { transform: translateY(-6px); }
        .fish-card-img { width: 100%; height: 180px; object-fit: cover; background: #d9eef5; pointer-events: none; }
        .fish-card-info { padding: 1rem; pointer-events: none; }
        .fish-card-title { font-weight: 800; font-size: 1.2rem; }
        .fish-card-stats { display: flex; justify-content: space-between; margin-top: 8px; font-size: 0.8rem; color: #2c6f8c; }
        .delete-fish-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            border-radius: 30px;
            width: 32px;
            height: 32px;
            font-size: 1.2rem;
            cursor: pointer;
            pointer-events: auto;
            z-index: 10;
        }
        .delete-fish-btn:hover { background: #e2583e; }
        .add-fish-form {
            background: #fefce8;
            border-radius: 1.8rem;
            padding: 1.2rem;
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-end;
            border: 1px solid #ffe3a3;
        }
        .add-fish-form input { flex: 2; padding: 0.7rem; border-radius: 2rem; border: 1px solid #ffe0a3; }
        .add-fish-form button { background: #2b9fc2; padding: 0.6rem 1.5rem; border-radius: 2rem; }
        .back-btn { background: #365f77; margin-bottom: 1rem; }
        .fish-detail-header {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            background: #f5fbfe;
            padding: 1.2rem;
            border-radius: 2rem;
            margin-bottom: 1.5rem;
        }
        .detail-img { width: 280px; object-fit: cover; border-radius: 1.5rem; }
        .detail-meta { flex: 1; }
        .rating-stars { display: flex; gap: 0.5rem; margin: 0.6rem 0; }
        .star { font-size: 2rem; cursor: pointer; background: none; border: none; color: #cbd5e1; transition: 0.1s; }
        .star.active { color: #f5b042; text-shadow: 0 0 4px #ffbb66; }
        .star:hover { transform: scale(1.1); }
        .score-text-badge { background: #243b44; display: inline-block; padding: 0.2rem 0.8rem; border-radius: 30px; color: white; font-size: 0.75rem; }
        
        /* 评论表单区域优化 */
        .comment-form-container {
            background: linear-gradient(135deg, #f0f9ff, #e6f4fa);
            padding: 1.5rem;
            border-radius: 1.8rem;
            margin-bottom: 1.8rem;
            border: 1px solid #cae3ef;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .comment-form-row {
            margin-bottom: 1rem;
        }
        .comment-form-row label {
            font-weight: 600;
            display: block;
            margin-bottom: 0.3rem;
            color: #016b8c;
        }
        .comment-form-row input, .comment-form-row textarea {
            width: 100%;
            padding: 0.7rem 1rem;
            border-radius: 1.5rem;
            border: 1.5px solid #cde5f0;
            font-family: inherit;
            font-size: 0.95rem;
            transition: 0.2s;
        }
        .comment-form-row input:focus, .comment-form-row textarea:focus {
            outline: none;
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px #fde68a;
        }
        .anonymous-check {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin: 0.8rem 0;
        }
        .anonymous-check input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #2b9fc2;
        }
        .anonymous-check label {
            cursor: pointer;
            font-weight: normal;
            color: #2c6f8c;
            margin: 0;
        }
        .device-nick-tip {
            font-size: 0.7rem;
            color: #5887a3;
            margin-top: 5px;
            background: #eef5f9;
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
        }
        
        /* 大号蓝色居中按钮 */
        .submit-comment-btn {
            background: #2b9fc2;
            color: white;
            border: none;
            padding: 0.9rem 2rem;
            border-radius: 3rem;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            max-width: 280px;
            display: block;
            margin: 0.8rem auto 0;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .submit-comment-btn:hover {
            background: #f59e0b;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }
        
        .comment-item {
            background: white;
            border-radius: 1.2rem;
            margin: 0.8rem 0;
            padding: 0.8rem 1rem;
            border-left: 5px solid #f5b042;
            position: relative;
        }
        .delete-comment-btn {
            position: absolute;
            right: 12px;
            top: 12px;
            background: #e0e7f0;
            border: none;
            border-radius: 30px;
            padding: 2px 10px;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.1s;
        }
        .delete-comment-btn:hover { background: #f5b042; color: white; }
        button { transition: 0.1s; cursor: pointer; }
        footer { text-align: center; margin-top: 1.5rem; font-size: 0.7rem; }
        .loading { text-align: center; padding: 2rem; color: #2c6f92; }
        @media (max-width: 680px) { 
            .app-container { padding: 1rem; } 
            .toolbar { flex-direction: column; }
            .detail-img { width: 100%; max-width: 280px; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app-container" id="app">
    <div class="nav-header">
        <div class="logo" id="homeLogoBtn">
            <h1>🐟 泡泡鱼图鉴 · 鱼友社区</h1>
        </div>
        <div class="nav-buttons">
            <!-- 首页按钮：跳转到指定链接 -->
            <a href="https://kevinming3671-sys.github.io/fish_intro/index.html" class="nav-btn" target="_blank" id="homeNavBtn">🏠 首页</a>
            <button class="nav-btn add-fish-btn" id="showAddFormBtn">➕ 新鱼发布</button>
        </div>
    </div>

    <div id="homeView">
        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 搜鱼名 / 标题...">
            </div>
            <div class="sort-box">
                <span>排序：</span>
                <button class="sort-btn" data-sort="hot">🔥 热度</button>
                <button class="sort-btn" data-sort="score">⭐ 平均分</button>
                <button class="sort-btn" data-sort="time">🕒 最新</button>
            </div>
        </div>
        <div id="inlineAddForm" style="display: none;" class="add-fish-form">
            <input type="text" id="newFishTitle" placeholder="鱼种名称" maxlength="40">
            <input type="file" id="newFishImage" accept="image/jpeg,image/png,image/webp">
            <button id="confirmAddFishBtn">✨ 确认上传</button>
            <button id="cancelAddBtn" style="background:#aaa;">取消</button>
        </div>
        <div id="fishGridContainer" class="fish-grid">加载鱼塘中...</div>
    </div>

    <div id="detailView" style="display: none;">
        <button class="nav-btn back-btn" id="backHomeBtn">← 返回列表</button>
        <div id="detailContent"></div>
    </div>
    <footer>🐠 评价实时同步 · 可匿名发布</footer>
</div>

<script>
    (function() {
        // ================== SUPABASE 凭证 =====================
        const SUPABASE_URL = "https://lciccmgqjvmzvvpytshp.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_BabKCuxCHtQMflQNefq_vw_dWxNuIz3";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const STORAGE_BUCKET = "fish-images";
        
        const scoreTextMap = { 1: "拉完了", 2: "NPC", 3: "人上人", 4: "顶级", 5: "夯" };
        
        // ================== 设备唯一昵称管理 ==================
        const STORAGE_DEVICE_ID_KEY = "fish_forum_device_id";
        const STORAGE_NICKNAME_KEY = "fish_forum_device_nickname";
        
        // 生成随机短ID (6位)
        function generateShortId() {
            return Math.random().toString(36).substring(2, 8);
        }
        
        // 获取或生成本设备唯一昵称 (例如“渔友_a3f2k9”)
        function getDeviceNickname() {
            let deviceId = localStorage.getItem(STORAGE_DEVICE_ID_KEY);
            let nickname = localStorage.getItem(STORAGE_NICKNAME_KEY);
            if (!deviceId) {
                deviceId = generateShortId();
                localStorage.setItem(STORAGE_DEVICE_ID_KEY, deviceId);
            }
            if (!nickname) {
                nickname = `鱼友${deviceId}`;
                localStorage.setItem(STORAGE_NICKNAME_KEY, nickname);
            }
            return nickname;
        }
        
        // 获取当前设备的默认昵称（非匿名时使用）
        let deviceDefaultNick = getDeviceNickname();
        
        let allFishes = [];
        let currentSort = "hot";
        let searchKeyword = "";
        let currentView = "home";
        let currentFishId = null;
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        // 修复后的 safeFileName 函数（纯英文数字 + 时间戳 + 随机哈希）
        function safeFileName(originalName, fishTitle) {
            // 获取文件扩展名（小写）
            const ext = originalName.split('.').pop().toLowerCase();
            // 时间戳毫秒
            const timestamp = Date.now();
            // 随机8位哈希（字母数字混合）
            const randomHash = Math.random().toString(36).substring(2, 10);
            // 纯英文/数字文件名，完全不依赖中文鱼名
            return `fish_${timestamp}_${randomHash}.${ext}`;
        }
        
        async function fetchFishStats(fishId) {
            const { data, error } = await supabase
                .from('comments')
                .select('score')
                .eq('fish_id', fishId);
            if (error || !data) return { avgScore: 0, totalCount: 0 };
            const total = data.length;
            if (total === 0) return { avgScore: 0, totalCount: 0 };
            const sum = data.reduce((acc, cur) => acc + cur.score, 0);
            return { avgScore: (sum / total), totalCount: total };
        }
        
        async function enrichFishesWithStats(fishes) {
            const enriched = await Promise.all(fishes.map(async (fish) => {
                const stats = await fetchFishStats(fish.id);
                return { ...fish, avgScore: stats.avgScore, commentCount: stats.totalCount };
            }));
            return enriched;
        }
        
        // 进入详情页
        window.goToDetail = function(fishId) {
            console.log("进入详情页，鱼ID:", fishId);
            currentFishId = fishId;
            currentView = "detail";
            document.getElementById('homeView').style.display = 'none';
            document.getElementById('detailView').style.display = 'block';
            showDetailView(fishId);
        };
        
        async function renderHome() {
            if (!allFishes.length) {
                document.getElementById('fishGridContainer').innerHTML = '<div class="loading">🐡 暂无鱼种，快点击“新鱼发布”上传第一只！</div>';
                return;
            }
            let fishesWithStats = await enrichFishesWithStats(allFishes);
            let filtered = fishesWithStats.filter(f => f.title.toLowerCase().includes(searchKeyword.toLowerCase()));
            
            if (currentSort === "hot") {
                filtered.sort((a,b) => (b.commentCount || 0) - (a.commentCount || 0));
            } else if (currentSort === "score") {
                filtered.sort((a,b) => (b.avgScore || 0) - (a.avgScore || 0));
            } else if (currentSort === "time") {
                filtered.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
            }
            
            const grid = document.getElementById('fishGridContainer');
            if (filtered.length === 0) {
                grid.innerHTML = '<div class="loading">🐟 没有找到相关鱼~</div>';
                return;
            }
            let html = '';
            for (let fish of filtered) {
                const avgFixed = fish.avgScore ? fish.avgScore.toFixed(1) : '暂无';
                const starShow = fish.avgScore ? '⭐ ' + avgFixed : '🐟 待评分';
                html += `
                    <div class="fish-card" data-id="${fish.id}" onclick="goToDetail(${fish.id})">
                        <img class="fish-card-img" src="${fish.image_url}" alt="${escapeHtml(fish.title)}" onerror="this.src='https://picsum.photos/id/129/300/180'">
                        <div class="fish-card-info">
                            <div class="fish-card-title">🐠 ${escapeHtml(fish.title)}</div>
                            <div class="fish-card-stats">
                                <span>${starShow}</span>
                                <span>💬 ${fish.commentCount || 0} 评</span>
                            </div>
                        </div>
                        <button class="delete-fish-btn" data-id="${fish.id}" data-title="${escapeHtml(fish.title)}" onclick="event.stopPropagation();">🗑️</button>
                    </div>
                `;
            }
            grid.innerHTML = html;
            
            document.querySelectorAll('.delete-fish-btn').forEach(btn => {
                btn.removeEventListener('click', handleDeleteFish);
                btn.addEventListener('click', handleDeleteFish);
            });
        }
        
        async function handleDeleteFish(e) {
            e.stopPropagation();
            const fishId = parseInt(this.getAttribute('data-id'));
            const title = this.getAttribute('data-title');
            if (confirm(`⚠️ 永久删除鱼“${title}”及其全部评论？`)) {
                await supabase.from('comments').delete().eq('fish_id', fishId);
                await supabase.from('fishes').delete().eq('id', fishId);
                await loadAllFishes();
                await renderHome();
                if (currentView === 'detail' && currentFishId === fishId) {
                    document.getElementById('detailView').style.display = 'none';
                    document.getElementById('homeView').style.display = 'block';
                    currentView = 'home';
                }
            }
        }
        
        async function showDetailView(fishId) {
            const fish = allFishes.find(f => f.id === fishId);
            if (!fish) { 
                alert("找不到该鱼数据");
                showHome();
                return; 
            }
            
            const { data: comments, error } = await supabase
                .from('comments')
                .select('*')
                .eq('fish_id', fishId)
                .order('created_at', { ascending: false });
            if (error) console.error(error);
            const commentsList = comments || [];
            
            let avgScore = 0;
            if (commentsList.length) {
                const totalScore = commentsList.reduce((a,b) => a + b.score, 0);
                avgScore = (totalScore / commentsList.length).toFixed(1);
            }
            
            let commentsHtml = '';
            for (let c of commentsList) {
                const starShow = "★".repeat(c.score) + "☆".repeat(5 - c.score);
                const time = new Date(c.created_at).toLocaleString();
                commentsHtml += `
                    <div class="comment-item" data-comment-id="${c.id}">
                        <div><strong>🐟 ${escapeHtml(c.nick || '匿名鱼友')}</strong> ⭐ ${c.score}/5 ${starShow} <span style="font-size:0.7rem;">${time}</span></div>
                        <div style="margin-top:5px;">${escapeHtml(c.content)}</div>
                        <button class="delete-comment-btn" data-cid="${c.id}" onclick="event.stopPropagation();">🗑️ 删除</button>
                    </div>
                `;
            }
            if (commentsList.length === 0) commentsHtml = '<div class="loading">🐟 暂无评论，来做第一个鱼友～</div>';
            
            // 构建详情页结构，包含匿名复选框
            const html = `
                <div class="fish-detail-header">
                    <img class="detail-img" src="${fish.image_url}" onerror="this.src='https://picsum.photos/id/129/300/300'">
                    <div class="detail-meta">
                        <h2>🐟 ${escapeHtml(fish.title)}</h2>
                        <div>⭐ 综合评分: ${avgScore || '暂无'} (${commentsList.length}人评价)</div>
                        <div class="rating-stars" id="detailStars"></div>
                        <div id="selectedRatingText" style="margin:5px 0; font-weight:500; color:#b45309;"></div>
                        <div class="score-text-badge" id="scoreLevelLabel">待评分</div>
                    </div>
                </div>
                
                <div class="comment-form-container">
                    <div class="comment-form-row">
                        <label>🎭 你的鱼友身份</label>
                        <input type="text" id="detailNickname" value="${escapeHtml(deviceDefaultNick)}" placeholder="你的昵称" maxlength="30" style="background:#ffffff;">
                        <div class="device-nick-tip">✨ 本设备默认身份: ${escapeHtml(deviceDefaultNick)} (可手动修改，下次评论会记住新昵称)</div>
                    </div>
                    
                    <div class="anonymous-check">
                        <input type="checkbox" id="anonymousCheckbox">
                        <label for="anonymousCheckbox">🙈 匿名发布</label>
                    </div>
                    
                    <div class="comment-form-row">
                        <label>💬 你的评价</label>
                        <textarea id="detailCommentText" rows="2" placeholder="说说你对这条鱼的印象..." maxlength="200"></textarea>
                    </div>
                    
                    <button id="submitDetailComment" class="submit-comment-btn">📤 发表评分 + 评论</button>
                </div>
                
                <h4 style="margin: 1rem 0 0.6rem 0;">📋 最新鱼友评价</h4>
                <div id="detailCommentsList">${commentsHtml}</div>
            `;
            document.getElementById('detailContent').innerHTML = html;
            
            // 星星组件逻辑
            let selectedStar = null;
            const starContainer = document.getElementById('detailStars');
            function renderStars(selected) {
                if (!starContainer) return;
                starContainer.innerHTML = '';
                for (let i = 1; i <= 5; i++) {
                    const star = document.createElement('button');
                    star.className = 'star';
                    star.innerHTML = (selected !== null && i <= selected) ? '★' : '☆';
                    if (selected !== null && i <= selected) star.classList.add('active');
                    star.onclick = () => {
                        selectedStar = i;
                        document.getElementById('selectedRatingText').innerHTML = `🎣 已选: ${i}星 (${scoreTextMap[i]})`;
                        document.getElementById('scoreLevelLabel').innerHTML = `给到一个 ${scoreTextMap[i]}`;
                        renderStars(i);
                    };
                    starContainer.appendChild(star);
                }
            }
            renderStars(null);
            
            // 监听昵称变化，如果用户手动修改则保存到 localStorage 作为新默认昵称
            const nicknameInput = document.getElementById('detailNickname');
            nicknameInput.addEventListener('change', function() {
                const newNick = this.value.trim();
                if (newNick && newNick !== "") {
                    deviceDefaultNick = newNick;
                    localStorage.setItem(STORAGE_NICKNAME_KEY, newNick);
                }
            });
            
            // 提交评论 (支持匿名)
            document.getElementById('submitDetailComment').onclick = async () => {
                if (selectedStar === null) { 
                    alert("🐟 请先点击星星为该鱼打分！"); 
                    return; 
                }
                let content = document.getElementById('detailCommentText').value.trim();
                if (!content) { 
                    alert("📝 请填写对该鱼的评价或心得~"); 
                    return; 
                }
                
                // 获取匿名选项
                const isAnonymous = document.getElementById('anonymousCheckbox').checked;
                let finalNick = nicknameInput.value.trim();
                if (!finalNick) finalNick = "热心鱼友";
                
                // 如果勾选匿名，则发布昵称强制为 "匿名渔友"，但设备默认昵称保留不变
                let displayNick = isAnonymous ? "匿名鱼友" : finalNick;
                
                // 确保设备默认昵称存回 localStorage (如果用户修改并取消匿名后)
                if (!isAnonymous && finalNick !== deviceDefaultNick) {
                    deviceDefaultNick = finalNick;
                    localStorage.setItem(STORAGE_NICKNAME_KEY, finalNick);
                }
                
                const { error: insertErr } = await supabase
                    .from('comments')
                    .insert([{
                        fish_id: fishId,
                        nick: displayNick,
                        score: selectedStar,
                        content: content
                    }]);
                if (insertErr) { 
                    alert("评论失败: " + insertErr.message); 
                    return; 
                }
                
                // 清空输入框和选择状态，保留匿名勾选框和昵称不变
                document.getElementById('detailCommentText').value = '';
                selectedStar = null;
                renderStars(null);
                document.getElementById('selectedRatingText').innerHTML = '';
                document.getElementById('scoreLevelLabel').innerHTML = '待评分';
                // 匿名勾选框不重置，保留用户习惯，但不清空昵称输入
                await showDetailView(fishId);
            };
            
            // 删除评论事件
            document.querySelectorAll('.delete-comment-btn').forEach(btn => {
                btn.onclick = async (e) => {
                    e.stopPropagation();
                    const commentId = parseInt(btn.getAttribute('data-cid'));
                    if (confirm("🗑️ 确定删除这条评论吗？")) {
                        await supabase.from('comments').delete().eq('id', commentId);
                        await showDetailView(fishId);
                    }
                };
            });
        }
        
        async function uploadFishImage(file, fishTitle) {
            if (!file) throw new Error("未选择图片");
            if (file.size > 5 * 1024 * 1024) throw new Error("图片不能超过 5MB");
            const fileName = safeFileName(file.name, fishTitle);
            const { error } = await supabase.storage.from(STORAGE_BUCKET).upload(fileName, file, {
                cacheControl: '3600', upsert: false, contentType: file.type
            });
            if (error) throw new Error(`上传失败: ${error.message}`);
            const { data: urlData } = supabase.storage.from(STORAGE_BUCKET).getPublicUrl(fileName);
            return urlData.publicUrl;
        }
        
        async function addNewFish(title, imageFile) {
            if (!title.trim()) throw new Error("鱼名不能为空");
            const imageUrl = await uploadFishImage(imageFile, title);
            const { error } = await supabase.from('fishes').insert([{ title: title.trim(), image_url: imageUrl }]);
            if (error) throw error;
            return true;
        }
        
        async function loadAllFishes() {
            const { data, error } = await supabase.from('fishes').select('*').order('created_at', { ascending: false });
            if (error) { 
                console.error(error); 
                allFishes = [];
            } else { 
                allFishes = data || []; 
                console.log("加载鱼类数量:", allFishes.length);
            }
        }
        
        function showHome() {
            currentView = "home";
            document.getElementById('homeView').style.display = 'block';
            document.getElementById('detailView').style.display = 'none';
            renderHome();
        }
        
        // 首页按钮改为外部链接，Logo也可以点击跳转
        const externalHomeUrl = "https://kevinming3671-sys.github.io/fish_intro/index.html";
        const homeNavBtn = document.getElementById('homeNavBtn');
        if (homeNavBtn) {
            homeNavBtn.href = externalHomeUrl;
            homeNavBtn.target = "_blank";
        }
        const logoDiv = document.getElementById('homeLogoBtn');
        if (logoDiv) {
            logoDiv.style.cursor = "pointer";
            logoDiv.addEventListener('click', () => {
                window.open(externalHomeUrl, "_blank");
            });
        }
        
        document.getElementById('backHomeBtn').onclick = showHome;
        
        const addFormDiv = document.getElementById('inlineAddForm');
        document.getElementById('showAddFormBtn').onclick = () => {
            addFormDiv.style.display = addFormDiv.style.display === 'none' ? 'flex' : 'none';
        };
        document.getElementById('cancelAddBtn').onclick = () => { addFormDiv.style.display = 'none'; };
        
        document.getElementById('confirmAddFishBtn').onclick = async () => {
            const title = document.getElementById('newFishTitle').value.trim();
            const file = document.getElementById('newFishImage').files[0];
            if (!title) { alert("请输入鱼名"); return; }
            if (!file) { alert("请选择图片"); return; }
            const btn = document.getElementById('confirmAddFishBtn');
            btn.disabled = true;
            btn.innerText = "上传中...";
            try {
                await addNewFish(title, file);
                alert(`✅ 添加成功: ${title}`);
                document.getElementById('newFishTitle').value = '';
                document.getElementById('newFishImage').value = '';
                addFormDiv.style.display = 'none';
                await loadAllFishes();
                await renderHome();
            } catch (err) {
                alert("添加失败: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "✨ 确认上传并发布";
            }
        };
        
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchKeyword = e.target.value;
            renderHome();
        });
        
        document.querySelectorAll('.sort-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentSort = btn.getAttribute('data-sort');
                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderHome();
            });
        });
        
        async function init() {
            await loadAllFishes();
            document.querySelector('.sort-btn[data-sort="hot"]').classList.add('active');
            showHome();
        }
        
        init();
    })();
</script>
</body>
</html>
